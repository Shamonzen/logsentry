# Only the local socket: no kernel log in a container, and nothing listens on the network.
module(load="imuxsock")

# RFC 3339 timestamps ("2026-10-22T09:01:12.123456+00:00 target sshd[42]: ..."): year and
# timezone included, which the sshd parser prefers over BSD syslog dates.
$ActionFileDefaultTemplate RSYSLOG_FileFormat
# logsentry-tail runs as UID 10001 and must be able to read the logs.
$FileCreateMode 0644
$DirCreateMode 0755
$Umask 0022

auth,authpriv.*    /var/log/lab/auth.log

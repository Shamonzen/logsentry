user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/lab/nginx_error.log;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    server_tokens off;
    # "combined" logs $remote_addr only, never X-Forwarded-For, so clients can't spoof their IP.
    access_log /var/log/lab/nginx_access.log combined;

    server {
        listen 80 default_server;
        root /var/www/html;
        index index.html index.nginx-debian.html;
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
